          required: false
          description: Més final (mm), usado com periodo_inicio e ano.
        - name: id_orgao
          in: query
          type: integer
          required: false
        - name: termo
          in: query
          type: string
          required: false
        - name: order_by
          in: query
          type: string
          required: false
          default: nome
        - name: order_dir
          in: query
          type: string
          required: false
          default: ASC
          enum: [ASC, DESC]
        - name: limit
          in: query
          type: integer
          required: false
          description: Limitado a MAX_ROWS=500.
        - name: page
          in: query
          type: integer
          required: false
        - name: export
          in: query
          type: boolean
          required: false
          default: false
      responses:
        '200':
          description: Dados encontrados.
          examples:
            application/json:
              status: 200
              data:
                data_ultima_carga: '2026-09-15 03:00:00'
                total_valor_empenhado: 5000000.00
                total_valor_liquidado: 4200000.00
                total_valor_pago: 4000000.00
                total_viajantes: 0
                qt_orgaos: 20
                orgaos:
                  - id_orgao: 1234
                    nome: SECRETARIA DE ESTADO DE FAZENDA
                    valor_empenhado: 300000.00
        '204':
          description: Sem dados para exibir.
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited

  /consultas/diarias/destinos.json:
