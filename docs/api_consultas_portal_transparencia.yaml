        '204':
          description: Nenhum dado encontrado para os filtros informados.
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited

  /consultas/diarias/individual.json:
    get:
      summary: Consulta individual de diárias (viajantes)
      description: >-
        Primeiro nível da consulta individual. Obrigatorios: ano, periodo_inicio
        e periodo_fim.
      parameters:
        - name: ano
          in: query
          type: integer
          required: true
        - name: periodo_inicio
          in: query
          type: string
          required: true
        - name: periodo_fim
          in: query
          type: string
          required: true
        - name: id_orgao
          in: query
          type: integer
          required: false
        - name: id_destino
          in: query
          type: integer
          required: false
        - name: id_destino_tipo
          in: query
          type: integer
          required: false
        - name: viajante
          in: query
          type: string
          required: false
        - name: cpf
          in: query
          type: integer
          required: false
        - name: cargo_comissao
          in: query
          type: string
          required: false
        - name: termo
          in: query
          type: string
          required: false
        - name: order_by
          in: query
          type: string
          required: false
          default: nome
        - name: order_dir
          in: query
          type: string
          required: false
          default: ASC
          enum: [ASC, DESC]
        - name: limit
          in: query
          type: integer
          required: false
        - name: page
          in: query
          type: integer
          required: false
        - name: export
          in: query
          type: boolean
          required: false
          default: false
      responses:
        '200':
          description: Dados encontrados.
          examples:
            application/json:
              status: 200
              data:
                viajantes:
                  - nome: FULANO DE TAL
                    valor_total: 8000.00
                qt_viajantes: 120
                viajantes_valor_total: 500000.00
                data_ultima_carga: '2026-09-15 03:00:00'
        '204':
