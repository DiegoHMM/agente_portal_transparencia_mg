swagger: '2.0'
info:
  title: Portal da Transparência - Consultas
  version: 1.0.0
  description: >-
    Documentação dos endpoints de consultas (Remuneracao, Diarias, Receitas e
    Despesas) do Portal da Transparência (MGapi - homologação). Prefixo comum:
    /consultas; os endpoints de dados usam o sufixo .json (exceto downloads).
    Observação: os textos estão sem acentuação apenas na documentação; as
    respostas da API mantêm a acentuação original.
host: homologacao.apigw.mgapi.prodemge.gov.br
basePath: /portaltransparencia/1.0.0
schemes:
  - https
x-observacoes-gerais:
  periodo: >-
    Em despesas e diarias, periodo_inicio/periodo_fim usam o formato DDMM
    (ex. 0101 a 3108 = 01/jan a 31/ago); diarias/individual e os gerar-csv
    rejeitam outro formato. Em receitas o formato e MM (ex. 01 a 08).
  user_agent: >-
    O firewall do gateway bloqueia (403) o User-Agent padrao do Python
    (Python-urllib); envie um User-Agent proprio.
  paginacao: >-
    limit define o tamanho da página (vários endpoints limitam a MAX_ROWS=500).
    page é a página (base 1); valores <= 0 são normalizados para 1. O offset é
    aplicado apenas quando limit e page são informados: OFFSET (limit*page-limit).
  ordenacao: >-
    order_by define a coluna e order_dir a direção (ASC/DESC). Cada endpoint
    possui uma whitelist de colunas; valores inválidos usam o padrão do endpoint.
  export: >-
    export=true altera o comportamento de paginação (retira o teto padrão) e/ou
    habilita a exportação dos dados.
  status_comuns:
    '200': Dados encontrados.
    '204': Sem dados para exibir.
    '400': Parametros obrigatorios ausentes ou invalidos.
    '422': Validacao de parametros falhou.
    '500': Erro interno ao processar a consulta.
paths:
  /consultas/consultas.json:
    get:
      summary: Lista de consultas disponíveis
      description: >-
        Lista as consultas cadastradas (metadados/configuração de um domínio de
        consulta), opcionalmente filtradas por tipo (ex. despesas, receitas).
      parameters:
        - name: tipo
          in: query
          required: false
          type: string
          description: Filtra as consultas por tipo.
        - name: limit
          in: query
          required: false
          type: integer
        - name: page
          in: query
          required: false
          type: integer
      responses:
        '200':
          description: Dados encontrados.
          examples:
            application/json:
              status: 200
              data:
                consultas:
                  - id: 1
                    nome: Remuneracao
                totalRegistros: 4
        '204':
          description: Sem dados para exibir.
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited

  /consultas/data-ultima-carga.json:
    get:
      summary: Data da última carga por tipo
      description: >-
        Retorna a data da última carga do armazém de dados. O parâmetro tipo é
        mapeado internamente (despesas/receitas -> ARMAZEM, diárias-viagens ->
        DIARIAS_SCDP, remuneracao -> REMUNERACAO, contratos -> ARMAZEM).
      parameters:
        - name: tipo
          in: query
          required: false
          type: string
          enum: [despesas, receitas, diarias-viagens, remuneracao, contratos]
          description: Tipo de dado cuja data de carga se deseja consultar.
      responses:
        '200':
          description: Dados encontrados.
          examples:
            application/json:
              status: 200
              data:
                - '2026-09-15 03:00:00'
        '204':
          description: Sem dados para exibir.
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited

  /consultas/remuneracao/orgao.json:
    get:
      summary: Remunera por órgão
      description: Retorna a remunera por órgão, com situações e séries para gráfico.
      parameters:
        - name: ano
          in: query
          type: integer
          required: false
        - name: mes
          in: query
          type: integer
          required: false
        - name: id_orgao
          in: query
          type: integer
          required: false
        - name: situacao
          in: query
          type: integer
          required: false
          description: Código da situação do servidor.
        - name: termo
          in: query
          type: string
          required: false
          description: Busca textual (acentos removidos automaticamente).
        - name: order_by
          in: query
          type: string
          required: false
          default: nome
        - name: order_dir
          in: query
          type: string
          required: false
          default: ASC
          enum: [ASC, DESC]
        - name: limit
          in: query
          type: integer
          required: false
        - name: page
          in: query
          type: integer
          required: false
        - name: export
          in: query
          type: boolean
          required: false
          default: false
      responses:
        '200':
          description: Dados encontrados.
          examples:
            application/json:
              status: 200
              data:
                data_ultima_carga: '2026-09-15 03:00:00'
                situacoes:
                  - cd_situacao: 1
                    situacao: ATIVO
                    remuneracao_ano:
                      - mes: 1
                        valor: 1200000.00
                orgaos:
                  - id_orgao: 1234
                    nome: SECRETARIA DE ESTADO DE FAZENDA
                qt_orgaos: 42
        '204':
          description: Sem dados para exibir.
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited

  /consultas/remuneracao/cargo.json:
    get:
      summary: Remunera por cargo
      description: Retorna a remunera por cargo efetivo/comiss.
      parameters:
        - name: ano
          in: query
          type: integer
          required: false
          description: Formato AAAA. Validado no controller.
        - name: mes
          in: query
          type: integer
          required: false
          description: Entre 1 e 12. Validado no controller.
        - name: id_cargo_efetivo
          in: query
          type: integer
          required: false
        - name: id_cargo_comissao
          in: query
          type: integer
          required: false
        - name: situacao
          in: query
          type: integer
          required: false
        - name: termo
          in: query
          type: string
          required: false
        - name: order_by
          in: query
          type: string
          required: false
          default: nome
        - name: order_dir
          in: query
          type: string
          required: false
          default: ASC
          enum: [ASC, DESC]
        - name: limit
          in: query
          type: integer
          required: false
        - name: page
          in: query
          type: integer
          required: false
        - name: export
          in: query
          type: boolean
          required: false
          default: false
      responses:
        '200':
          description: Dados encontrados.
          examples:
            application/json:
              status: 200
              data:
                data_ultima_carga: '2026-09-15 03:00:00'
                cargos:
                  - nome: ANALISTA
                    total: 15000000.00
                total: 320
        '204':
          description: Sem dados para exibir.
        '400':
          description: ano ou mes em formato inválido.
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited
  /consultas/remuneracao/individual.json:
    get:
      summary: Consulta individual de remunera
      description: Retorna servidores e valores. ano e mes são obrigatórios.
      parameters:
        - name: ano
          in: query
          type: integer
          required: true
        - name: mes
          in: query
          type: integer
          required: true
        - name: id_orgao
          in: query
          type: integer
          required: false
        - name: situacao
          in: query
          type: integer
          required: false
        - name: nome_servidor
          in: query
          type: string
          required: false
          description: Espaços são convertidos em curinga (%).
        - name: masp
          in: query
          type: string
          required: false
        - name: id_cargo_efetivo
          in: query
          type: integer
          required: false
        - name: id_cargo_comissao
          in: query
          type: integer
          required: false
        - name: termo
          in: query
          type: string
          required: false
        - name: order_by
          in: query
          type: string
          required: false
          default: nome_servidor
        - name: order_dir
          in: query
          type: string
          required: false
          default: ASC
          enum: [ASC, DESC]
        - name: limit
          in: query
          type: integer
          required: false
        - name: page
          in: query
          type: integer
          required: false
        - name: export
          in: query
          type: boolean
          required: false
          default: false
      responses:
        '200':
          description: Dados encontrados.
          examples:
            application/json:
              status: 200
              data:
                data_ultima_carga: '2026-09-15 03:00:00'
                servidores:
                  - nome_servidor: FULANO DE TAL
                    masp: '1234567'
                    remuneracao_bruta: 12000.00
                qt_servidores: 320
        '204':
          description: Sem dados para exibir.
        '400':
          description: ano e mes são obrigatórios.
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited

  /consultas/remuneracao/detalhamento.json:
    get:
      summary: Detalhamento da remuneração de um servidor
      description: >-
        Retorna o detalhamento de rubricas. E obrigatório informar masp OU hash.
        Nos testes, hash (vindo de remuneracao/individual) funcionou; masp
        retornou aviso PHP em HTML.
      parameters:
        - name: masp
          in: query
          type: string
          required: false
          description: Obrigatório se hash não for informado.
        - name: hash
          in: query
          type: string
          required: false
          description: Obrigatório se masp não for informado. Tem prioridade sobre masp.
        - name: ano
          in: query
          type: integer
          required: false
        - name: mes
          in: query
          type: integer
          required: false
        - name: id_servidor
          in: query
          type: integer
          required: false
        - name: id_orgao
          in: query
          type: integer
          required: false
        - name: id_remuneracao
          in: query
          type: integer
          required: false
        - name: termo
          in: query
          type: string
          required: false
        - name: order_by
          in: query
          type: string
          required: false
        - name: order_dir
          in: query
          type: string
          required: false
          enum: [ASC, DESC]
        - name: limit
          in: query
          type: integer
          required: false
        - name: page
          in: query
          type: integer
          required: false
        - name: export
          in: query
          type: boolean
          required: false
          default: false
      responses:
        '200':
          description: Dados encontrados.
          examples:
            application/json:
              status: 200
              data:
                data_ultima_carga: '2026-09-15 03:00:00'
                detalhamento:
                  - nome: FULANO DE TAL
                    remuneracao_bruta: 12000.00
                    descontos_totais: 3000.00
                    remuneracao_liquida: 9000.00
                qt_registros: 1
        '204':
          description: Sem dados para exibir.
        '400':
          description: Informe masp ou hash.
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited

  /consultas/remuneracao/jetons.json:
    get:
      summary: Pagamentos de jetons
      description: >-
        Retorna a distribuicao por empresa e a tabela de pagamentos de jetons.
        Retorna 500 (template ausente) quando o mes nao tem dados.
      parameters:
        - name: ano
          in: query
          type: integer
          required: false
        - name: mes
          in: query
          type: integer
          required: false
          description: Entre 1 e 12; valores fora da faixa são ignorados.
        - name: id_servidor
          in: query
          type: integer
          required: false
        - name: id_remuneracao
          in: query
          type: integer
          required: false
        - name: nome_empresa
          in: query
          type: string
          required: false
        - name: nome_servidor
          in: query
          type: string
          required: false
        - name: termo
          in: query
          type: string
          required: false
        - name: order_by
          in: query
          type: string
          required: false
          default: recebedor
          enum: [recebedor, masp, cargo_efetivo, cargo_em_comissao, vr_jeton, empresa_sigla, mes_ano]
        - name: order_dir
          in: query
          type: string
          required: false
          default: ASC
          enum: [ASC, DESC]
        - name: limit
          in: query
          type: integer
          required: false
          default: 25
        - name: page
          in: query
          type: integer
          required: false
          default: 1
        - name: export
          in: query
          type: boolean
          required: false
          default: false
      responses:
        '200':
          description: Dados encontrados.
          examples:
            application/json:
              status: 200
              data:
                data_ultima_carga: '2026-09-15 03:00:00'
                total_pago_jetons: 500000.00
                total_empresas: 12
                total_servidores: 80
                distribuicao_empresas:
                  - empresa_sigla: XPTO
                    valor: 120000.00
                tabela_pagamentos_jetons:
                  - recebedor: FULANO DE TAL
                    vr_jeton: 1500.00
        '204':
          description: Sem dados (sem corpo de resposta).
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited

  /consultas/remuneracao/situacao.json:
    get:
      summary: Remuneração por situação
      description: >-
        Retorna valores de remuneração por situação. Nao envie limit/page:
        o backend retorna 500 (ORA-00933).
      parameters:
