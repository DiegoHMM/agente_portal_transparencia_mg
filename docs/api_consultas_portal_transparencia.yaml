          in: query
          type: integer
          required: false
        - name: mes
          in: query
          type: integer
          required: false
        - name: situacao
          in: query
          type: integer
          required: false
        - name: id_orgao
          in: query
          type: integer
          required: false
      responses:
        '200':
          description: Dados encontrados.
          examples:
            application/json:
              status: 200
              data:
                - ano: 2026
                  mes: 1
                  situacao: ATIVO
                  valor: 12000000.00
        '204':
          description: Sem dados para exibir.
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited

  /consultas/remuneracao/lista-orgaos.json:
