          type: integer
          required: false
        - name: page
          in: query
          type: integer
          required: false
      responses:
        '200':
          description: Dados encontrados.
        '204':
          description: Sem dados para exibir.
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited

  /consultas/remuneracao/lista-cargos-efetivos.json:
    get:
      summary: Lista de cargos efetivos
      parameters:
        - name: termo
          in: query
          type: string
          required: false
        - name: cargo_efetivo_id
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        - name: page
          in: query
          type: integer
          required: false
      responses:
        '200':
          description: Dados encontrados.
        '204':
          description: Sem dados para exibir.
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited

  /consultas/remuneracao/lista-cargos-comissao.json:
    get:
      summary: Lista de cargos em comiss
      parameters:
        - name: termo
          in: query
          type: string
          required: false
        - name: cargo_comissao_id
          in: query
          type: integer
          required: false
        - name: limit
          in: query
          type: integer
          required: false
        - name: page
          in: query
          type: integer
          required: false
      responses:
        '200':
          description: Dados encontrados.
        '204':
          description: Sem dados para exibir.
      x-auth-type: Application & Application User
      x-throttling-tier: Unlimited

  /consultas/remuneracao/lista-anos-meses.json:
    get:
      summary: Lista de anos e meses disponíveis
      responses:
        '200':
          description: Dados encontrados.
        '204':
